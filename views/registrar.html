$def with ()
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Pedido</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>

    <h1>Registrar Nuevo Pedido</h1>
    <nav>
        <a href="/">Regresar</a>
    </nav>

    <form method="POST" action="/registrar">
        <div class="campo">
            <label for="cliente">Nombre del Cliente:</label>
            <input type="text" id="cliente" name="cliente" required>
        </div>

        <div class="campo">
            <label for="producto">Producto:</label>
            <input type="text" id="producto" name="producto" required>
        </div>

        <div class="campo">
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" value="1" min="1" required>
        </div>

        <div class="campo">
            <label for="tiempo">Tiempo estimado (minutos):</label>
            <input type="number" id="tiempo" name="tiempo" value="5" min="1" required>
        </div>

        <div class="campo">
            <label for="tipo">Tipo de Atención:</label>
            <select id="tipo" name="tipo">
                <option value="Normal">Normal</option>
                <option value="Prioritario">Prioritario (Clase próxima)</option>
            </select>
        </div>

        <button type="submit" class="btn btn-verde">Guardar Pedido</button>
    </form>

</body>
</html>
