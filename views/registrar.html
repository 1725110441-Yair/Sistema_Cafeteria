$def with ()
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar Pedido</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --cafe-fondo: #8b5e39;
            --cafe-superficie: #1f1914;
            --cafe-dorado: #c8a46a;
            --cafe-crema: #f1e6d3;
        }

        body {
            background-color: var(--cafe-fondo);
            color: var(--cafe-crema);
            font-family: 'Lato', sans-serif;
            font-weight: 300;
        }

        h1, .navbar-brand {
            font-family: 'Playfair Display', serif;
            color: var(--cafe-dorado);
            letter-spacing: 1px;
        }

        .navbar { background-color: var(--cafe-fondo); }

        .card {
            background-color: var(--cafe-superficie);
            border: 1px solid rgba(200, 164, 106, .25);
        }

        .form-label {
            color: var(--cafe-dorado);
            text-transform: uppercase;
            font-size: .8rem;
            letter-spacing: 2px;
        }

        .form-control, .form-select {
            background-color: var(--cafe-fondo);
            color: var(--cafe-crema);
            border: 1px solid rgba(200, 164, 106, .3);
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--cafe-fondo);
            color: var(--cafe-crema);
            border-color: var(--cafe-dorado);
            box-shadow: 0 0 0 .2rem rgba(200, 164, 106, .25);
        }

        .btn-cafe {
            background-color: transparent;
            color: var(--cafe-dorado);
            border: 1px solid var(--cafe-dorado);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-cafe:hover {
            background-color: var(--cafe-dorado);
            color: var(--cafe-fondo);
        }
    </style>
</head>
<body>

    <nav class="navbar border-bottom border-secondary-subtle">
        <div class="container">
            <span class="navbar-brand mb-0">Cafetería</span>
            <a href="/" class="btn btn-cafe btn-sm">Regresar</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <h1 class="text-center mb-4">Registrar Nuevo Pedido</h1>

                <form method="POST" action="/registrar" class="card p-4">

                    <div class="mb-3">
                        <label for="cliente" class="form-label">Nombre del Cliente</label>
                        <input type="text" class="form-control" id="cliente" name="cliente" required>
                    </div>

                    <div class="mb-3">
                        <label for="producto" class="form-label">Producto</label>
                        <input type="text" class="form-control" id="producto" name="producto" required>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="cantidad" class="form-label">Cantidad</label>
                            <input type="number" class="form-control" id="cantidad" name="cantidad" value="1" min="1" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="tiempo" class="form-label">Tiempo estimado (min)</label>
                            <input type="number" class="form-control" id="tiempo" name="tiempo" value="5" min="1" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="tipo" class="form-label">Tipo de Atención</label>
                        <select class="form-select" id="tipo" name="tipo">
                            <option value="Normal">Normal</option>
                            <option value="Prioritario">Prioritario (Clase próxima)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-cafe w-100">Guardar Pedido</button>
                </form>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
